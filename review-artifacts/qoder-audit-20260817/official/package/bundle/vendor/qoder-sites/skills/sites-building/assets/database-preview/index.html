<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes — local preview</title>
<style>body{max-width:720px;margin:48px auto;padding:0 20px;font:16px/1.6 system-ui;color:#20242c;background:#f7f8fa}button,select{font:inherit;padding:7px 12px}li{padding:10px;background:white;margin:8px 0}#status{min-height:1.6em}</style>
<h1>Notes</h1>
<p>Local sample data · no cloud database connection</p>
<label>Preview state <select id="mode"><option value="normal">Sample records</option><option value="empty">Empty</option><option value="error">Database error</option></select></label>
<button id="reload">Reload</button>
<p id="status" role="status" aria-live="polite"></p>
<ul id="items"></ul>
<button id="next" disabled>Next page</button>
<script type="module">
const mode=document.querySelector('#mode'),status=document.querySelector('#status'),items=document.querySelector('#items'),next=document.querySelector('#next'),reload=document.querySelector('#reload');
let offset=0;
async function load(reset=false){
 if(reset) offset=0;
 next.disabled=reload.disabled=mode.disabled=true;
 items.replaceChildren();status.textContent='Loading…';
 try{
  const response=await fetch(`/functions/v1/app?action=list&offset=${offset}&fixture=${mode.value}`);
  if(!response.ok) throw Error('Could not load notes. Try again.');
  const data=await response.json();
  for(const row of data.items){const li=document.createElement('li');li.textContent=row.title;items.append(li);}
  status.textContent=data.items.length?`Showing ${data.items.length} local sample records`:'No notes yet.';
  next.disabled=!data.hasMore;
  if(data.hasMore) offset=data.nextOffset;
 }catch(error){status.textContent=error.message;}
 finally{reload.disabled=mode.disabled=false;}
}
next.addEventListener('click',()=>load());reload.addEventListener('click',()=>load(true));mode.addEventListener('change',()=>load(true));load(true);
</script>
</html>
