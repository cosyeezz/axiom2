<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Axiom2</title>
    <link rel="icon" type="image/svg+xml" href="../assets/axiom-icon.svg" />
    <style>html,body{margin:0;background:#101214;color:#d5d9d6;color-scheme:dark}.startup-fallback{max-width:520px;margin:14vh auto;padding:28px;font:14px/1.8 system-ui,sans-serif}.startup-fallback>span{font-size:11px;letter-spacing:.12em;color:#b7a37e}.startup-fallback h1{font-size:24px;font-weight:500}.startup-fallback p{color:#9da7aa}.startup-fallback pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#c8b390}.startup-fallback a,.startup-fallback button{display:inline-block;border:1px solid #4b4c43;border-radius:6px;padding:10px 16px;margin-right:10px;background:#252721;color:#ddc69c;font:inherit;text-decoration:none;cursor:pointer}</style>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("axiom.theme")==="light"?"light":"dark"}catch{document.documentElement.dataset.theme="dark"}</script>
    <style>html[data-theme=light],html[data-theme=light] body{background:#f7f6f3;color:#252824;color-scheme:light}</style>
  </head>
  <body>
    <div id="root"><main class="startup-fallback"><span>AXIOM 2 / DESKTOP</span><h1>正在准备连接页面…</h1><p>若页面未能载入，可以重新加载。后台服务会继续运行。</p><a href="">重新加载</a></main></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
