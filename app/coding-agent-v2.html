<style>
:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #08090a;              /* marketing black — hero canvas */
  --surface:      #191a1b;              /* elevated surface — cards, dropdowns */
  --surface-warm: var(--surface);       /* no warm tier in dark achromatic system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #f7f8f8;                      /* near-white primary text */
  --fg-2: #d0d6e0;                      /* silver-gray body / secondary text */
  --muted: #8a8f98;                     /* tertiary — placeholders, metadata */
  --meta:  #62666d;                     /* quaternary — timestamps, disabled */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.08);   /* standard semi-transparent white */
  --border-soft: rgba(255, 255, 255, 0.05);   /* ultra-subtle divider */

  /* ─── Accent ───────────────────────────────────────────────────── */
  /* 用户配色：暖橙交互、金黄收藏、绿色完成，替代蓝紫色。 */
  --accent:        oklch(0.76 0.13 55);
  --accent-on:     #08090a;
  --accent-hover:  oklch(0.84 0.11 65);
  --accent-active: oklch(0.88 0.09 65);

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #27a644;                   /* Linear green */
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale — DESIGN.md §Typography Hierarchy.
   * Linear's display range 72px→10px; the 8 schema slots map the
   * key stops. 64px secondary-hero lives inline in components.html. */
  --text-xs:   12px;                    /* label / micro */
  --text-sm:   14px;                    /* caption large / link small */
  --text-base: 16px;                    /* body — standard reading */
  --text-lg:   18px;                    /* body large — feature descriptions */
  --text-xl:   24px;                    /* heading 2 */
  --text-2xl:  32px;                    /* heading 1 */
  --text-3xl:  48px;                    /* display — section headlines */
  --text-4xl:  72px;                    /* display XL — hero */

  /* Leading + tracking.
   * --leading-tight=1.00: Linear's signature "engineered" compression.
   * h2 (32px) → 1.13; h3 (24px) → 1.33 per DESIGN.md spec.
   * --tracking-display: -0.022em = -1.584px / 72px normalized. */
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — DESIGN.md §Whitespace Philosophy. */
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  /* 6px for buttons/inputs (comfortable), 8px cards, 12px panels. */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* On dark surfaces: luminance stepping, not opaque drop shadows.
     --elev-raised uses semi-transparent border-as-shadow technique. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.4) 0px 2px 4px,
    0 0 0 1px rgba(255, 255, 255, 0.05);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Multi-layer stack per DESIGN.md §6 + §7: accent ring makes the
     indicator visible on the near-black #08090a canvas. */
  --focus-ring:
    0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%),
    0 4px 12px rgba(0, 0, 0, 0.1);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* No identity chrome: the raised user bubble distinguishes each turn. */
.log-row{display:block}
.log-row:has(.user-text){width:fit-content;max-width:80%;margin-left:auto}
.log-row>div{min-width:0}
.log-row .user-text{background:color-mix(in oklch,var(--accent) 30%,var(--surface));border-color:color-mix(in oklch,var(--accent) 20%,var(--border));border-radius:var(--radius-lg);color:var(--fg);text-align:left}
@media(max-width:640px){.log-row:has(.user-text){max-width:92%}}
.history-row .history-item{min-height:44px;padding:3px 10px;gap:0}
.history-row .history-item strong{line-height:20px;min-width:0;flex:1}
.history-row .session-title-line{display:flex;align-items:center;gap:6px;min-width:0}
.history-row .history-item small{font-variant-numeric:tabular-nums}
.history-row .history-item small{display:flex;align-items:center;gap:5px;margin-top:0;line-height:16px}
.history-row .session-detail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .session-state{width:8px;height:8px;margin:0;flex-shrink:0}
.session-state.running{color:var(--success)}
.session-state.unread{color:oklch(0.76 0.13 250)}
.history-row{display:flex;align-items:center;border-radius:6px;margin-bottom:0;min-width:0}
.history-row:has([aria-current=true]){background:color-mix(in oklch,var(--fg) 6%,transparent)}
.history-row:hover,.history-row:focus-within{background:color-mix(in oklch,var(--fg) 10%,transparent)}
.history-row .history-item:hover,.history-row .session-pin:hover,.history-row .session-pin:focus-visible{background:transparent}
.history-row .history-item:focus-visible,.history-row .session-pin:focus-visible{outline-offset:-3px}
.history-row .history-item{flex:1;min-width:0;width:auto;margin:0;padding-right:4px}
.history-row .history-item>span{width:100%;min-width:0}
.history-row .history-item strong,.history-row .history-item small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-row .history-item[aria-current=true]{background:transparent;border-color:transparent}
.session-pin{flex-shrink:0;opacity:0;color:var(--muted)}
.history-row:hover .session-pin,.history-row:focus-within .session-pin{opacity:1}
.session-pin:hover,.session-pin:focus-visible{color:var(--fg)}
.session-pin svg{width:16px;height:16px;stroke-width:1.7}
.session-pin[aria-pressed=true]{color:var(--fg-2)}
.session-pin[aria-pressed=true]:hover,.session-pin[aria-pressed=true]:focus-visible{color:var(--fg)}
.history-group+.history-group{margin-top:20px}
@media(hover:none){.session-pin{opacity:1}}
@media(prefers-reduced-motion:reduce){.session-state.running{animation:none}}
/* Always dock the composer below the independently scrolling thread.
   Keep it in flow so it never covers the last message. */
.composer-area{flex-shrink:0;padding:8px 0 env(safe-area-inset-bottom,0px)}
.composer{padding:16px 16px 10px;border-color:color-mix(in oklch,var(--fg) 14%,transparent);background:color-mix(in oklch,var(--bg) 55%,var(--surface))}
.composer textarea{height:88px;padding:0 4px 12px}

.composer-foot{display:block;min-height:20px;padding:0 4px}
.composer-foot .status{display:block;min-height:20px;line-height:20px;overflow-wrap:anywhere}
.composer-foot>span:last-child{display:none}
.workspace:has(.empty-state) .thread-heading{display:none}
.workspace:has(.empty-state) .empty-state{padding:40px 0 24px}
.workspace:has(.empty-state) .empty-state .brand-mark{display:none}
.workspace:has(.empty-state) .empty-state h2{margin:0 0 12px}
.workspace:has(.empty-state) .quick-prompts{margin-top:20px}

 .composer-area{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Compact composer: one row at rest, expands naturally for longer drafts. */
.composer{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:end;gap:8px;padding:4px 10px;border-radius:32px;background:var(--surface)}
.composer:focus-within{border-color:color-mix(in oklch,var(--fg) 35%,transparent)}
.composer textarea{grid-column:2;grid-row:1;height:44px;min-height:44px;max-height:180px;padding:10px 0;font-size:16px;line-height:24px;overflow-y:auto;scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.composer-tools,.composer-tools>.row{display:contents}
#attach{grid-column:1;grid-row:1;border-radius:50%}
#mode{grid-column:3;grid-row:1;max-width:112px;font-size:13px;margin-right:52px}
.send{grid-column:3;grid-row:1;justify-self:end;background:var(--fg);color:var(--bg)}
.send:hover:not(:disabled){background:color-mix(in oklch,var(--fg) 97%,white);color:var(--bg)}
.send svg{stroke-width:1.8;width:24px;height:24px}
.attachment:not(:empty){grid-column:1/-1;grid-row:2;padding:4px 12px}
.run-state{align-items:flex-start;flex-wrap:wrap}.run-spinner{width:10px;height:10px;margin-top:7px;border:0;background:var(--fg-2);animation:run-pulse 1.4s ease-in-out infinite}
.run-output{flex-basis:100%;white-space:pre-wrap;line-height:1.85;color:var(--fg-2);font-size:14px}.run-output:empty{display:none}
@keyframes run-pulse{50%{opacity:.35;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.run-spinner{animation:none}}
@media(max-width:640px){.composer{gap:4px;padding:4px 8px;border-radius:28px}.composer textarea{font-size:16px}#mode{max-width:88px;padding:0 2px;font-size:12px;margin-right:48px}}
.usage{margin-top:4px;color:var(--muted);font-size:12px}
.usage-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 20px;padding:0 12px}

.search{margin-bottom:12px}.topnav{min-height:56px;padding-block:6px;gap:12px}.title-block{min-width:0;flex:1}.topnav h1{font-size:16px;line-height:1.4}.title-meta{display:flex;align-items:center;gap:6px;width:fit-content;max-width:100%;height:22px;font-size:12px;line-height:20px;color:var(--muted)}.title-meta span{display:inline-flex;align-items:center;gap:5px}.title-meta .session-state{width:12px;height:12px}.top-actions{gap:4px}.top-actions .tag{border:0;padding:0;font-size:11px}.topnav>.row{gap:8px}
@media(max-width:640px){.topnav h1{font-size:14px}.topnav{min-height:56px}.workspace-list{max-height:35dvh}}
@media(hover:none),(pointer:coarse){.title-meta{height:44px}.topnav{height:auto;min-height:80px}}
/* Subagent launchers are summaries only. The dialog hosts the SAME live
   workspace node: renderer, composer, model picker, usage and handlers. */
.subagents{margin:18px 0 8px;border:1px solid var(--border);border-radius:var(--radius-md);background:color-mix(in oklch,var(--fg) 2%,transparent);overflow-wrap:anywhere}
.subagents-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
.subagents-head strong{color:var(--fg-2);font-weight:510}.subagents-head small{margin-left:auto;font-size:11px}
.subagents-head>svg{width:16px;height:16px;color:var(--fg-2)}
.subagent{display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;min-height:80px;color:var(--fg-2);border-radius:0;background:color-mix(in oklch,currentColor 5%,transparent);transition:background var(--motion-fast)}
.subagent:last-child{border-radius:0 0 var(--radius-md) var(--radius-md)}
.subagent+.subagent{border-top:1px solid var(--border)}
.subagent:hover{background:color-mix(in oklch,currentColor 9%,transparent)}
.subagent:active{background:color-mix(in oklch,currentColor 12%,transparent)}
.subagent:focus-visible{outline-offset:-3px}
.agent-identity{grid-column:2;grid-row:1;min-width:0;display:grid;gap:4px;color:var(--fg-2)}.agent-identity strong{font-size:13px;font-weight:510}.agent-identity small{font-size:12px;color:var(--muted);line-height:1.6}
.subagent:hover .agent-identity strong{color:var(--fg)}
.agent-open{grid-column:4;grid-row:1;width:16px;height:16px;color:var(--fg-2)}
.agent-state{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:20px;color:var(--fg-2);white-space:nowrap}
.agent-state svg{width:14px;height:14px;stroke-width:1.8}
:is(.subagent:has([data-state=completed]),.agent-state[data-state=completed]){color:color-mix(in oklch,var(--success) 55%,var(--fg))}
:is(.subagent:has([data-state=waiting]),.agent-state[data-state=waiting]){color:color-mix(in oklch,var(--warn) 65%,var(--fg))}
:is(.subagent:has([data-state=failed]),.agent-state[data-state=failed]){color:color-mix(in oklch,var(--danger) 55%,var(--fg))}
:is(.subagent:has([data-state=running]),.agent-state[data-state=running]){color:var(--accent-hover)}
.subagent .agent-state{display:contents;color:inherit}
.subagent .agent-state svg{grid-column:1;grid-row:1;width:36px;height:36px;padding:8px;border-radius:var(--radius-md);background:color-mix(in oklch,currentColor 12%,transparent)}
.subagent .agent-state-label{grid-column:3;grid-row:1;padding:2px 8px;border:1px solid color-mix(in oklch,currentColor 18%,transparent);border-radius:var(--radius-pill);background:color-mix(in oklch,currentColor 8%,transparent);font-size:11px;font-weight:510}

.subagent-dialog::backdrop{background:color-mix(in oklch,var(--bg) 76%,transparent)}
.subagent-dialog[open]{display:flex;flex-direction:column}
.subagent-dialog-head{display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:56px;padding:6px 16px 6px 24px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--fg) 3%,var(--bg))}
.subagent-dialog-heading{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-width:0;flex:1;font-size:13px}.subagent-dialog-heading span{color:var(--muted)}
.subagent-dialog-heading strong{font-weight:510}.subagent-dialog>.workspace{flex:1;min-height:0}
.subagent-dialog .topnav{padding-inline:24px;height:auto;min-height:64px}.subagent-dialog .topnav h1{white-space:normal;overflow-wrap:anywhere}
.subagent-dialog #toggle-history,.subagent-dialog .path-actions{display:none!important}
.subagent-dialog .thread-content{padding-top:24px}.subagent-dialog .composer-area{padding-bottom:8px}
.subagent-dialog .container{width:calc(100% - 48px)}.subagent-dialog .title-meta{max-width:100%}
.workspace-snapshot{pointer-events:none;user-select:none}.workspace-snapshot .mobile-toggle{display:none}.workspace-snapshot .composer-tools>.row>.icon-btn{grid-column:1;grid-row:1;border-radius:50%}.workspace-snapshot .title-meta>span:first-child{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subagent-dialog .model-popover{max-height:min(440px,calc(100dvh - 260px))}
@media(max-width:640px){.subagent{padding:12px;gap:8px}.subagents-head{padding-inline:12px}.agent-identity small{font-size:11px}.agent-state{font-size:11px}.subagent-dialog{width:calc(100% - 16px);height:calc(100dvh - 16px)}.subagent-dialog-head{padding-left:16px;gap:8px}.subagent-dialog .topnav{padding-inline:16px}.subagent-dialog .container{width:calc(100% - 32px)}}

</style>
</head>

 return seconds<60?seconds+' 秒':Math.floor(seconds/60)+' 分 '+seconds%60+' 秒';

$('copy-workspace-path').onclick=async()=>{
 const path=workspaces.find(w=>w.id===workspaceId).path;
 if(!path)return;
 const suffix=directorySuffix;
 const text=displayWorkspacePath(path);
 try{await navigator.clipboard.writeText(text);$('status').textContent=path.endsWith(suffix)?'已复制目录名称；浏览器未提供完整路径':'已复制工作空间路径';}
 catch(error){$('status').textContent='无法访问剪贴板，请选中标题下的路径手动复制';}

$('attach').onclick=()=>$('file').click();
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;if(f.size>100000){$('status').textContent='请使用小于 100 KB 的文本或代码文件';$('file').value='';return;}const owner=active;try{const loaded={name:f.name,text:await f.text()};if(active!==owner){const draft=drafts.get(owner)||{text:''};draft.attachment=loaded;drafts.set(owner,draft);return;}attachment=loaded;renderAttachment();$('status').textContent='附件仅在本地读取，不会上传';}catch(e){$('status').textContent='文件读取失败，请重新选择';}};
$('export').onclick=()=>{const s=current();const text=s.title+'\n\n'+s.messages.map(m=>(m.role==='user'?'你':'编码助手')+'\n'+m.text+(m.code?'\n\n'+m.code:'')).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='编码对话.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出当前对话';};
// Small runnable integrity check: run in the browser console with runChecks().
window.runChecks=()=>{console.assert(escapeHTML('<script>"&')==='&lt;script&gt;&quot;&amp;','转义检查');console.assert(validSessions(initial)&&!validSessions([{id:'bad'}]),'会话验证');console.assert(current()&&document.querySelectorAll('.history-item').length>0,'会话渲染');for(const [provider,models] of Object.entries(modelCatalog)){for(const model of models){const config=normalizeModel({provider,model:model.id,reasoning:'invalid'});if(config.provider!==provider||config.model!==model.id||!model.levels.includes(config.reasoning))throw new Error('模型联动失败');}}if(document.querySelectorAll('.model-option').length!==Object.keys(modelCatalog).reduce((n,p)=>n+matchingModels(p,$('model-search').value).length,0)||!modelCatalog[(modelDraft||normalizeModel(current().modelConfig)).provider].find(m=>m.id===(modelDraft||normalizeModel(current().modelConfig)).model).levels.includes($('effort-select').value))throw new Error('模型菜单渲染失败');for(const provider of Object.keys(modelCatalog)){const switched=normalizeModel({...normalizeModel(current().modelConfig),provider});const model=modelCatalog[provider].find(m=>m.id===switched.model);if(!model||!model.levels.includes(switched.reasoning))throw new Error('供应商切换联动失败');}if(matchingModels('Anthropic','anthropic sonnet').length!==1)throw new Error('供应商与模型联合搜索失败');if(matchingModels('OpenAI','  GPT-5  ').length!==1||matchingModels('Google','GPT').length!==0)throw new Error('供应商内搜索失败');return '检查完成';};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden'){markCurrentRead();history();}});
// Runnable status regression check: runSessionStatusChecks() in the console.
window.runSessionStatusChecks=()=>{
 const s={id:'status-check',messages:[]};
 const expect=(value,want)=>{if(value!==want)throw new Error(`会话状态：${value}，预期 ${want}`);};
 expect(sessionState(s,false),'idle');expect(sessionState(s,true),'running');
 s.demoRunning=true;expect(sessionState(s,false),'running');delete s.demoRunning;
 expect(sessionState(s,false),'idle');
 s.messages.push({role:'assistant',text:'完成'});expect(sessionState(s,false),'completed');
 s.unread=true;expect(sessionState(s,false),'unread');expect(sessionState(s,true),'running');
 expect(sessionState(JSON.parse(JSON.stringify(s)),false),'unread');
 s.unread=false;expect(sessionState(s,false),'completed');
 s.messages[0].stopped=true;expect(sessionState(s,false),'idle');
 s.messages.push({role:'user',text:'继续'});expect(sessionState(s,false),'idle');
 return '会话状态检查通过';
};
// Run runSessionDisplayChecks() in the browser console.
window.runSessionDisplayChecks=()=>{
 const s={messages:[]};
 if(sessionDetail(s)!=='未记录时间 · 0 条消息')throw new Error('旧会话不应伪造时间');
 s.updatedAt=new Date(2026,0,2,13,4).getTime();s.messages.push({role:'user',text:'检查'});
 const detail=sessionDetail(s);s.pinned=true;
 if(!detail.includes('13:04')||!detail.endsWith(' · 1 条消息')||sessionDetail(s)!==detail)throw new Error('时间、消息数量或置顶显示不一致');
 history();
 for(const dot of $('history').querySelectorAll('.session-state')){
  if(!dot.parentElement.classList.contains('session-title-line')||dot.nextElementSibling?.tagName!=='STRONG')throw new Error('状态点必须位于标题前');
 }
 for(const row of $('history').querySelectorAll('.history-row')){
  const item=row.querySelector('[data-session]'),session=sessions.find(s=>s.id===item.dataset.session);
  if(row.querySelector('.session-detail').textContent!==sessionDetail(session))throw new Error('会话副信息错误');
 }
 return '会话时间、消息数量和状态点检查通过';
};
// Run runSidebarChecks() in the browser console at desktop or mobile width.
window.runSidebarChecks=()=>{
 const original=$('app').className,focused=document.activeElement;
 try{
  for(const expanded of [false,true,false]){
   $('app').classList.toggle('history-open',sidebarMobile.matches&&expanded);
   $('app').classList.toggle('sidebar-collapsed',!sidebarMobile.matches&&!expanded);syncSidebar();
   if(($('toggle-history').getAttribute('aria-expanded')==='true')!==expanded)throw new Error('侧栏状态不同步');
   if((getComputedStyle($('history-sidebar')).display!=='none')!==expanded)throw new Error('侧栏显隐错误');
   if((getComputedStyle($('toggle-history')).display==='none')!==expanded)throw new Error('展开时应隐藏标题前的入口');
   if(!expanded&&getComputedStyle($('toggle-history')).left!=='8px')throw new Error('展开入口应位于最左侧');
   toggleSidebar();
   if(($('toggle-history').getAttribute('aria-expanded')==='true')===expanded)throw new Error('侧栏切换失败');
  }
  return '侧栏折叠检查通过';
 }finally{$('app').className=original;syncSidebar();focused?.focus();}
};

window.runWorkspaceHeaderChecks=()=>{
 renderWorkspace();updateRunning();
 const selected=workspaces.find(w=>w.id===workspaceId);
 if($('workspace-list').querySelectorAll('[data-workspace]').length!==workspaces.filter(w=>w.path).length)throw new Error('空间数量不一致');
 if(selected.path&&$('workspace-list').querySelector('[aria-current="true"]')?.dataset.workspace!==workspaceId)throw new Error('当前空间未标记');
 if($('workspace-name').textContent!==workspaces.find(w=>w.id===workspaceId).name)throw new Error('空间名称不同步');
 if($('workspace-trigger').getAttribute('aria-label')!==(selected.path?`当前工作空间：${$('workspace-name').textContent}，点击切换`:'选择工作空间'))throw new Error('当前工作空间标签不同步');
 const path=workspaces.find(w=>w.id===workspaceId).path;
 if($('title-path').textContent!==(displayWorkspacePath(path)||'未关联文件夹'))throw new Error('标题路径不同步');
 if($('open-workspace-path').disabled!==!path)throw new Error('目录打开按钮状态错误');
 if(displayWorkspacePath('项目'+directorySuffix)!=='项目'||displayWorkspacePath('/Users/test/project')!=='/Users/test/project')throw new Error('路径显示转换错误');
 if(getComputedStyle($('title-path')).whiteSpace!=='nowrap')throw new Error('路径必须保持单行');
 const copy=$('copy-workspace-path').getBoundingClientRect(),open=$('open-workspace-path').getBoundingClientRect();
 if(copy.width!==open.width||copy.height!==open.height||copy.top!==open.top)throw new Error('路径操作尺寸或对齐不一致');
 if($('copy-workspace-path').disabled!==!path)throw new Error('路径复制按钮状态错误');
 $('workspace-picker').open=true;$('workspace-trigger').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 if($('workspace-picker').open)throw new Error('关闭空间列表失败');
 return '工作空间与标题检查通过';
};
