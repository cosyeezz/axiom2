plugins { id 'com.android.application' }
def releaseVersion = providers.gradleProperty('clientVersion').getOrElse(new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version)
if (!(releaseVersion ==~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/)) throw new GradleException('Invalid release version')
def parts = releaseVersion.tokenize('.').collect { it.toLong() }
def releaseCode = parts[0] * 1000000L + parts[1] * 1000L + parts[2]
if (parts[1] > 999 || parts[2] > 999 || releaseCode <= 404 || releaseCode > 2100000000L) throw new GradleException('Release version cannot be encoded as an upgradeable Android versionCode')
android {
    namespace 'com.axiom2.android'
    compileSdk 35
    defaultConfig { applicationId 'com.axiom2.android'; minSdk 26; targetSdk 35; versionCode releaseCode.toInteger(); versionName releaseVersion }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
def qrJar = rootProject.file('libs/core-3.5.3.jar')
if (java.security.MessageDigest.getInstance('SHA-256').digest(qrJar.bytes).encodeHex().toString() != '8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82') throw new GradleException('ZXing dependency checksum mismatch')
dependencies { implementation project(':sdk'); implementation files(qrJar) }
