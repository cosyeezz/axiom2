name: Validate Axiom2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
        scope: ['agent', 'native', 'timeout-start', 'timeout-stall']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Agent lifecycle repeated three times
        if: matrix.scope == 'agent'
        run: |
          foreach ($attempt in 1..3) {
            node scripts/run-windows-diagnostic.mjs app/tests/agent.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native compiler and host ownership regression
        if: matrix.scope == 'native'
        run: node scripts/run-windows-diagnostic.mjs app/tests/windows-open-host.test.ts
      - name: Cleanup after startup timeout
        if: matrix.scope == 'timeout-start'
        run: node scripts/verify-agent-timeout.mjs start
      - name: Cleanup after stalled provider timeout
        if: matrix.scope == 'timeout-stall'
        run: node scripts/verify-agent-timeout.mjs stall
