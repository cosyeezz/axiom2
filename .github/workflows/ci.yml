name: Validate Axiom2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
        scope: ['agent']
        attempt: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: File save and capability path diagnosis
        if: matrix.scope == 'files'
        run: |
          node scripts/diagnose-rename.mjs
          node scripts/run-windows-diagnostic.mjs app/tests/file-edit.test.ts app/tests/capability-preferences.test.ts
      - name: Agent lifecycle diagnosis
        if: matrix.scope == 'agent'
        run: node scripts/run-windows-diagnostic.mjs app/tests/agent.test.ts
