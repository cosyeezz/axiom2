name: Validate Axiom2
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Supersede validation only. Publication has its own non-cancelling lock in
# backend-release.yml, so a new push cannot interrupt asset publication.
# Retrying an old run must not cancel validation for the current master head.
concurrency:
  group: axiom-ci-${{ github.event_name }}-${{ github.ref }}-${{ github.run_attempt == 1 && 'latest' || github.run_id }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-native.mjs
      - name: Configure namespace test environment
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: node --test native/owner.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ownership-${{ runner.arch }}
          path: bin/native/
          if-no-files-found: error
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.19.0', '24']
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # Isolated runners bound serial test duration without dropping any tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install fd for native file completion tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y fd-find ;;
            macOS) brew install fd ;;
          esac
      - name: Install fd on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'fd.zip'
          Invoke-WebRequest 'https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a227701b8551c35a9931d9f6da75503cf86d88e182d71fb849a70864c5d57cd7') { throw 'fd checksum mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'fd'
          Expand-Archive $archive $directory
          $binary = Get-ChildItem $directory -Filter fd.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'fd.exe missing' }
          & $binary.FullName --version
          $binary.DirectoryName >> $env:GITHUB_PATH
      - name: Configure Linux namespace test environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: node --test scripts/auto-release.test.mjs scripts/release-controller.test.mjs scripts/test-ci.test.mjs
      - name: Run serial test shard
        shell: bash
        env:
          AXIOM_TEST_CARGO_FETCH: '1'
        run: |
          set -o pipefail
          node scripts/test-ci.mjs '${{ matrix.shard }}/4' 2>&1 | tee "$RUNNER_TEMP/axiom-tests.log"
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-${{ matrix.node }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/axiom-tests.log
          if-no-files-found: ignore
  package:
    # Windows tests and package checks can exceed 30 minutes together.
    # Run installation, upgrade, rollback and cleanup with their own bounded job.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    # Windows Node 22 completed all package assertions at minute 27, then hit
    # the 30-minute job limit while cleaning up its isolated installations.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.node == '22.19.0' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure Linux namespace test environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run check:package
