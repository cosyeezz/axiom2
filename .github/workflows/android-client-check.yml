name: Validate published Android client
on:
  push:
    branches: [release/clients-0.4.8]
    paths: [.github/workflows/android-client-check.yml, scripts/check-android-release.py]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft or public client release containing the signed APK
        required: true
        type: string
      apk_sha256:
        description: Expected SHA-256 of the exact signed release APK
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact APK and existing backend
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ inputs.release_tag || 'v0.4.8' }}
          APK_SHA256: ${{ inputs.apk_sha256 || '5d7492c0dfb3e0fc5e739f1da8e08563620b71098adc044074dba6ff717f38d6' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-runtime "$RUNNER_TEMP/backend-download"
          gh release download "$CLIENT_TAG" --pattern Axiom2-Android.apk --dir artifacts/android-runtime
          printf '%s  %s\n' "$APK_SHA256" artifacts/android-runtime/Axiom2-Android.apk | sha256sum -c -
          gh release download v0.4.7 --pattern axiom2.tgz --pattern SHA256SUMS --dir "$RUNNER_TEMP/backend-download"
          (cd "$RUNNER_TEMP/backend-download" && sha256sum --ignore-missing -c SHA256SUMS)
          npm install --prefix "$RUNNER_TEMP/backend" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/backend-download/axiom2.tgz"
      - name: Start isolated released backend
        env:
          AXIOM_DATA_DIR: ${{ runner.temp }}/android-data
          AXIOM_PI_DIR: ${{ runner.temp }}/android-pi
          AXIOM_PORT: '4319'
        run: node "$RUNNER_TEMP/backend/node_modules/@cosyeezz/axiom2/bin/axiom2.mjs" start --json
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/check-android-release.py artifacts/android-runtime/Axiom2-Android.apk artifacts/android-runtime
      - name: Stop isolated backend
        if: always()
        env:
          AXIOM_DATA_DIR: ${{ runner.temp }}/android-data
          AXIOM_PI_DIR: ${{ runner.temp }}/android-pi
          AXIOM_PORT: '4319'
        run: |
          if test -f "$RUNNER_TEMP/backend/node_modules/@cosyeezz/axiom2/bin/axiom2.mjs"; then
            node "$RUNNER_TEMP/backend/node_modules/@cosyeezz/axiom2/bin/axiom2.mjs" stop --json
          fi
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Axiom2-Android-runtime
          path: artifacts/android-runtime/
          if-no-files-found: error
          retention-days: 30
