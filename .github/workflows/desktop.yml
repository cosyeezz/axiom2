name: Verify Axiom2 Windows release package
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows desktop build run ID
        type: string
        required: true
      release_tag:
        description: Immutable version tag
        type: string
        required: true
      source_sha:
        description: Exact commit at the release tag
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify-windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify immutable build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AXIOM_BUILD_RUN: ${{ inputs.build_run }}
          AXIOM_RELEASE_TAG: ${{ inputs.release_tag }}
          AXIOM_RELEASE_SOURCE: ${{ inputs.source_sha }}
        run: node scripts/prepare-windows-release-check.mjs
      - name: Verify versions and isolated installation lifecycle
        shell: pwsh
        run: ./scripts/check-windows-release-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Axiom2-Windows-package-check
          path: |
            artifacts/windows-package-check/*.json
            artifacts/windows-package-check/*.log
            artifacts/windows-package-check/*.png
          if-no-files-found: error
          retention-days: 30
