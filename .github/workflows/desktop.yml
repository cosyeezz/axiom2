name: Diagnose Windows native resource publishing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Run immutable native publishing tests
        env:
          AXIOM_TEST_CARGO_FETCH: '1'
        run: node scripts/test-environment-inventory.mjs
