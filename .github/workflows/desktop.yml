name: Build Axiom2 Desktop
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform
        type: choice
        options: [all, macos, windows, linux]
        default: all
      source_ref:
        description: Source tag or commit (empty uses the workflow ref)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  desktop:
    if: inputs.platform != 'linux'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.platform == 'macos' && fromJSON('["macos-latest"]') || inputs.platform == 'windows' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Record source revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm --prefix app run build:desktop
      - run: node scripts/build-desktop.mjs --targets ${{ runner.os == 'macOS' && 'universal' || 'x64' }}
      - name: Verify native resources
        env:
          AXIOM_TEST_CARGO_FETCH: '1'
        run: node scripts/test-environment-inventory.mjs
      - name: Verify independent tool maintenance
        run: node node_modules/tsx/dist/cli.mjs --test app/tests/offline-tool-maintenance.test.ts app/tests/rtk-removal.test.ts
      - name: Verify macOS disk image and universal application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify app/Axiom2.dmg
          mount="$(mktemp -d "$RUNNER_TEMP/axiom-dmg.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" app/Axiom2.dmg
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$mount/Axiom2.app"
          plist="$bundle/Contents/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          test "$version" = "$(node -p 'require("./package.json").version')"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = local.axiom2.desktop
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          binary="$bundle/Contents/MacOS/$executable"
          lipo "$binary" -verify_arch arm64 x86_64
          file "$binary"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          codesign --display --verbose=2 "$bundle"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist"
          if grep -aEq 'AXIOM_UPDATE_TEST_ORIGIN|AXIOM_DESKTOP_DEBUG_PORT|AXIOM_DESKTOP_PROBE_REPORT|axiom_test_probe|axiom-test-installer-launches.jsonl|local.axiom2.desktop.test' "$binary"; then
            echo 'Test hooks found in production binary' >&2
            exit 1
          fi
          ditto "$bundle" "$RUNNER_TEMP/axiom-macos-smoke/Axiom2.app"
          (cd app && shasum -a 256 Axiom2.dmg > SHA256SUMS-macos)
      - name: Smoke test macOS controller window
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/axiom-macos-smoke"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke/Axiom2.app/Contents/Info.plist")
          mkdir "$smoke/data"
          AXIOM_DATA_DIR="$smoke/data" "$smoke/Axiom2.app/Contents/MacOS/$executable" > "$smoke/startup.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat "$smoke/startup.log"' EXIT
          AXIOM_SMOKE_PID="$pid" /usr/bin/swift - <<'SWIFT'
          import Foundation
          import CoreGraphics
          let pid = Int(ProcessInfo.processInfo.environment["AXIOM_SMOKE_PID"]!)!
          for _ in 0..<30 {
              let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
              if windows.contains(where: { window in
                  guard window[kCGWindowOwnerPID as String] as? Int == pid,
                        window[kCGWindowLayer as String] as? Int == 0,
                        let bounds = window[kCGWindowBounds as String] as? [String: Any],
                        let width = bounds["Width"] as? Double,
                        let height = bounds["Height"] as? Double else { return false }
                  return width >= 360 && height >= 600
              }) {
                  print("PASS: native controller process owns a visible application window")
                  exit(0)
              }
              Thread.sleep(forTimeInterval: 1)
          }
          fputs("No visible controller window within 30 seconds\n", stderr)
          exit(1)
          SWIFT
          kill -0 "$pid"
      - name: Load native regression probes from workflow revision
        if: runner.os == 'macOS'
        shell: bash
        env:
          AXIOM_REGRESSION_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The distributed DMG is already built and verified from source_ref.
          # Only the isolated test application's JS probes use the workflow revision.
          git fetch --no-tags --depth=1 origin "$AXIOM_REGRESSION_REF"
          for name in test-controller-probe.js test-workbench-probe.js; do
            git show "$AXIOM_REGRESSION_REF:app/desktop/$name" > "app/desktop/$name"
          done
          echo "Native regression probe revision: $AXIOM_REGRESSION_REF"
      - name: Build isolated macOS native probe
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target="$(node -p 'process.arch === "arm64" ? "arm64" : "x64"')"
          node scripts/build-desktop.mjs --targets "$target" --test-instance
      - name: Check macOS single-window WebViews and service lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$(mktemp -d "$RUNNER_TEMP/axiom-probe-dmg.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" app/Axiom2-ServiceTest.dmg
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$mount/Axiom2-ServiceTest.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = local.axiom2.desktop.test
          ditto "$bundle" "$RUNNER_TEMP/axiom-native-probe/Axiom2-ServiceTest.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
          AXIOM_DESKTOP_BINARY="$RUNNER_TEMP/axiom-native-probe/Axiom2-ServiceTest.app/Contents/MacOS/$executable" node scripts/check-desktop-macos.mjs
      - name: Preserve macOS native check evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Axiom2-macOS-native-check
          path: app/test-results/desktop-macos.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'Axiom2-macOS-universal' || 'Axiom2-Windows-x64' }}
          path: |
            ${{ runner.os == 'macOS' && 'app/Axiom2.dmg' || 'app/Axiom2.*' }}
            ${{ runner.os == 'macOS' && 'app/SHA256SUMS-macos' || '' }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve macOS diagnostics on failure
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Axiom2-macOS-diagnostics
          path: |
            app/Axiom2.dmg
            ${{ runner.temp }}/axiom-macos-smoke/startup.log
            app/test-results/
          if-no-files-found: warn
          retention-days: 7
  linux-desktop:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            deb_arch: amd64
            machine: Advanced Micro Devices X86-64
          - os: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
            machine: AArch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Record source revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf curl wget file dpkg-dev
      # The root prepare script builds bootstrap and the native supervisor before packaging.
      - run: npm ci
      - name: Configure namespace test environment
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Build the packaged worker before testing its headless entry point.
      - run: npm --prefix app run build:desktop
      # Linux --targets selects the package format; CPU architecture follows the runner.
      - run: node scripts/build-desktop.mjs --targets deb
      - name: Check native supervisor and offline cleanup
        env:
          # Fetch pinned test compiler dependencies once; fixture tests use --offline.
          AXIOM_TEST_CARGO_FETCH: '1'
        run: |
          node --test native/owner.test.mjs
          node scripts/test-environment-inventory.mjs
          cd app
          ../node_modules/.bin/tsx --test tests/desktop-native.test.ts tests/archive-cleanup.test.ts tests/pi-removal.test.ts tests/service-removal.test.ts tests/offline-tool-maintenance.test.ts tests/rtk-removal.test.ts
      - name: Verify Linux desktop artifacts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          test -s app/Axiom2.deb
          test -x app/Axiom2-binary
          file app/Axiom2-binary
          readelf -h app/Axiom2-binary
          readelf -h app/Axiom2-binary | grep -F "Machine:" | grep -F "$EXPECTED_MACHINE"
          dpkg-deb --info app/Axiom2.deb
          dpkg-deb --contents app/Axiom2.deb
          test "$(dpkg-deb -f app/Axiom2.deb Architecture)" = "$EXPECTED_DEB_ARCH"
          test "$(dpkg-deb -f app/Axiom2.deb Version)" = "$(node -p 'require("./package.json").version')"
          node --input-type=module - <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateLinuxHelper } from './app/desktop/desktop-native.mjs';
          const bundle = JSON.parse(await readFile('artifacts/pake-template/src-tauri/src/native-helper.json', 'utf8'));
          validateLinuxHelper(bundle, process.arch);
          JS
          (cd app && sha256sum Axiom2.deb Axiom2-binary > SHA256SUMS-linux)
      - name: Verify packaged archive worker without a display
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          import { mkdtemp, mkdir, realpath, stat, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const root = await realpath(await mkdtemp(join(tmpdir(), 'axiom-packaged-worker-')));
          try {
            await mkdir(join(root, 'updates'));
            const info = await stat(join(root, 'updates'), { bigint: true });
            const request = { root, op: 'inspect', taskId: randomUUID(), directory: [String(info.dev), String(info.ino)] };
            const env = { ...process.env }; delete env.DISPLAY; delete env.WAYLAND_DISPLAY;
            const result = JSON.parse(execFileSync(resolve('app/Axiom2-binary'), ['--axiom-archive-worker', JSON.stringify(request)], { env, encoding: 'utf8', timeout: 10_000 }));
            assert.equal(result.writerStopped, true); assert.equal(result.quarantine, false);
          } finally { await rm(root, { recursive: true, force: true }); }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: Axiom2-Linux-${{ matrix.arch }}
          path: |
            app/Axiom2.deb
            app/Axiom2-binary
            app/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 30
