name: Android Tailnet checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['verify/android-tailnet-*']
  pull_request:
    paths:
      - 'app/android/**'
      - 'scripts/check-android-tailnet.py'
      - '.github/workflows/android-tailnet.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install compile tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native API, Keystore, UI and process restart checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/check-android-tailnet.py --serial emulator-5554
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tailnet-checks
          path: |
            artifacts/android-tailnet/instrumentation/*.log
            artifacts/android-tailnet/instrumentation/screenshots/**
          if-no-files-found: warn
