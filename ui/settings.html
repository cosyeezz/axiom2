:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #08090a;              /* marketing black — hero canvas */
  --surface:      #191a1b;              /* elevated surface — cards, dropdowns */
  --surface-warm: var(--surface);       /* no warm tier in dark achromatic system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #f7f8f8;                      /* near-white primary text */
  --fg-2: #d0d6e0;                      /* silver-gray body / secondary text */
  --muted: #8a8f98;                     /* tertiary — placeholders, metadata */
  --meta:  #62666d;                     /* quaternary — timestamps, disabled */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.08);   /* standard semi-transparent white */
  --border-soft: rgba(255, 255, 255, 0.05);   /* ultra-subtle divider */

  /* ─── Accent ───────────────────────────────────────────────────── */
  /* 用户配色：暖橙交互、金黄收藏、绿色完成，替代蓝紫色。 */
  --accent:        oklch(0.76 0.13 55);
  --accent-on:     #08090a;
  --accent-hover:  oklch(0.84 0.11 65);
  --accent-active: oklch(0.88 0.09 65);

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #27a644;                   /* Linear green */
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale — DESIGN.md §Typography Hierarchy.
   * Linear's display range 72px→10px; the 8 schema slots map the
   * key stops. 64px secondary-hero lives inline in components.html. */
  --text-xs:   12px;                    /* label / micro */
  --text-sm:   14px;                    /* caption large / link small */
  --text-base: 16px;                    /* body — standard reading */
  --text-lg:   18px;                    /* body large — feature descriptions */
  --text-xl:   24px;                    /* heading 2 */
  --text-2xl:  32px;                    /* heading 1 */
  --text-3xl:  48px;                    /* display — section headlines */
  --text-4xl:  72px;                    /* display XL — hero */

  /* Leading + tracking.
   * --leading-tight=1.00: Linear's signature "engineered" compression.
   * h2 (32px) → 1.13; h3 (24px) → 1.33 per DESIGN.md spec.
   * --tracking-display: -0.022em = -1.584px / 72px normalized. */
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — DESIGN.md §Whitespace Philosophy. */
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  /* 6px for buttons/inputs (comfortable), 8px cards, 12px panels. */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* On dark surfaces: luminance stepping, not opaque drop shadows.
     --elev-raised uses semi-transparent border-as-shadow technique. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.4) 0px 2px 4px,
    0 0 0 1px rgba(255, 255, 255, 0.05);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Multi-layer stack per DESIGN.md §6 + §7: accent ring makes the
     indicator visible on the near-black #08090a canvas. */
  --focus-ring:
    0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%),
    0 4px 12px rgba(0, 0, 0, 0.1);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='coding-agent-model-config-v1';
const reasoningNames={none:'不设置',levels:'低 / 中 / 高',toggle:'开关',auto:'自动'};
const protocols={openai:'OpenAI 兼容',anthropic:'Anthropic',google:'Google Gemini'};
const initialProviders=[
 {id:'openai',name:'OpenAI',protocol:'openai',url:'https://api.openai.com/v1',configured:false,models:[]},
 {id:'anthropic',name:'Anthropic',protocol:'anthropic',url:'https://api.anthropic.com',configured:false,models:[]},
 {id:'google',name:'Google',protocol:'google',url:'https://generativelanguage.googleapis.com/v1beta',configured:false,models:[]}
];
function validEndpoint(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)&&!!url.hostname&&!url.username&&!url.password;}catch{return false;}}
function validProviders(value){return Array.isArray(value)&&value.length<=100&&new Set(value.map(p=>p?.id)).size===value.length&&value.every(p=>p&&typeof p.id==='string'&&/^[a-z0-9-]+$/.test(p.id)&&typeof p.name==='string'&&p.name.trim()&&p.name.length<=80&&Object.hasOwn(protocols,p.protocol)&&typeof p.url==='string'&&p.url.length<=2048&&(p.url===''||validEndpoint(p.url))&&typeof p.configured==='boolean'&&Array.isArray(p.models)&&p.models.length<=200&&new Set(p.models.map(m=>m?.id)).size===p.models.length&&p.models.every(m=>m&&typeof m.id==='string'&&m.id.trim()&&m.id.length<=160&&typeof m.name==='string'&&m.name.trim()&&m.name.length<=160&&Object.hasOwn(reasoningNames,m.reasoning)));}
// Keys never enter persistent storage. A desktop credential vault is needed for real integration.
function publicProviders(list){return list.map(p=>({id:p.id,name:p.name,protocol:p.protocol,url:p.url,configured:p.configured,models:p.models.map(m=>({id:m.id,name:m.name,reasoning:m.reasoning}))}));}

function readConfigurationSummary(){
 try{
  const raw=localStorage.getItem(storageKey);
  if(raw===null)return {text:initialProviders.length+' 个待配置供应商 · 0 个模型',message:'请先保存供应商连接信息，再从已配置供应商中选择并添加模型。'};
  const saved=JSON.parse(raw);
  if(!saved||saved.version!==1||!validProviders(saved.providers))throw new Error('Invalid configuration');
  const eligible=saved.providers.filter(p=>p.configured&&validEndpoint(p.url)),count=eligible.reduce((n,p)=>n+p.models.length,0),configured=eligible.length;
  return {text:saved.providers.length+' 个供应商 · '+count+' 个模型',message:'已保存 '+configured+' 个供应商的连接配置；保存不代表连接验证成功。'};
 }catch{return {text:'配置读取失败',message:'本地记录无法读取，请进入模型服务检查；现有记录未被覆盖。'};}
}
const summary=readConfigurationSummary();$('model-config-summary').textContent=summary.text;$('overview-feedback').textContent=summary.message;
</script>
