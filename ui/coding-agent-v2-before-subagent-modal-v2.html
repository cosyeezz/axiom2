<style>
:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #08090a;              /* marketing black — hero canvas */
  --surface:      #191a1b;              /* elevated surface — cards, dropdowns */
  --surface-warm: var(--surface);       /* no warm tier in dark achromatic system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #f7f8f8;                      /* near-white primary text */
  --fg-2: #d0d6e0;                      /* silver-gray body / secondary text */
  --muted: #8a8f98;                     /* tertiary — placeholders, metadata */
  --meta:  #62666d;                     /* quaternary — timestamps, disabled */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.08);   /* standard semi-transparent white */
  --border-soft: rgba(255, 255, 255, 0.05);   /* ultra-subtle divider */

  /* ─── Accent ───────────────────────────────────────────────────── */
  /* 用户配色：暖橙交互、金黄收藏、绿色完成，替代蓝紫色。 */
  --accent:        oklch(0.76 0.13 55);
  --accent-on:     #08090a;
  --accent-hover:  oklch(0.84 0.11 65);
  --accent-active: oklch(0.88 0.09 65);

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #27a644;                   /* Linear green */
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale — DESIGN.md §Typography Hierarchy.
   * Linear's display range 72px→10px; the 8 schema slots map the
   * key stops. 64px secondary-hero lives inline in components.html. */
  --text-xs:   12px;                    /* label / micro */
  --text-sm:   14px;                    /* caption large / link small */
  --text-base: 16px;                    /* body — standard reading */
  --text-lg:   18px;                    /* body large — feature descriptions */
  --text-xl:   24px;                    /* heading 2 */
  --text-2xl:  32px;                    /* heading 1 */
  --text-3xl:  48px;                    /* display — section headlines */
  --text-4xl:  72px;                    /* display XL — hero */

  /* Leading + tracking.
   * --leading-tight=1.00: Linear's signature "engineered" compression.
   * h2 (32px) → 1.13; h3 (24px) → 1.33 per DESIGN.md spec.
   * --tracking-display: -0.022em = -1.584px / 72px normalized. */
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* Section rhythm — DESIGN.md §Whitespace Philosophy. */
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  /* 6px for buttons/inputs (comfortable), 8px cards, 12px panels. */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  /* On dark surfaces: luminance stepping, not opaque drop shadows.
     --elev-raised uses semi-transparent border-as-shadow technique. */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised:
    rgba(0, 0, 0, 0.4) 0px 2px 4px,
    0 0 0 1px rgba(255, 255, 255, 0.05);

  /* ─── Focus ────────────────────────────────────────────────────── */
  /* Multi-layer stack per DESIGN.md §6 + §7: accent ring makes the
     indicator visible on the near-black #08090a canvas. */
  --focus-ring:
    0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%),
    0 4px 12px rgba(0, 0, 0, 0.1);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* No identity chrome: the raised user bubble distinguishes each turn. */
.log-row{display:block}
.log-row:has(.user-text){width:fit-content;max-width:80%;margin-left:auto}
.log-row>div{min-width:0}
.log-row .user-text{background:color-mix(in oklch,var(--accent) 30%,var(--surface));border-color:color-mix(in oklch,var(--accent) 20%,var(--border));border-radius:var(--radius-lg);color:var(--fg);text-align:left}
@media(max-width:640px){.log-row:has(.user-text){max-width:92%}}
.history-row .history-item{min-height:44px;padding:3px 10px;gap:0}
.history-row .history-item strong{line-height:20px;min-width:0;flex:1}
.history-row .session-title-line{display:flex;align-items:center;gap:6px;min-width:0}
.history-row .history-item small{font-variant-numeric:tabular-nums}
.history-row .history-item small{display:flex;align-items:center;gap:5px;margin-top:0;line-height:16px}
.history-row .session-detail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .session-state{width:8px;height:8px;margin:0;flex-shrink:0}
.session-state.running{color:var(--success)}
.session-state.unread{color:oklch(0.76 0.13 250)}
.history-row{display:flex;align-items:center;border-radius:6px;margin-bottom:0;min-width:0}
.history-row:has([aria-current=true]){background:color-mix(in oklch,var(--fg) 6%,transparent)}
.history-row:hover,.history-row:focus-within{background:color-mix(in oklch,var(--fg) 10%,transparent)}
.history-row .history-item:hover,.history-row .session-pin:hover,.history-row .session-pin:focus-visible{background:transparent}
.history-row .history-item:focus-visible,.history-row .session-pin:focus-visible{outline-offset:-3px}
.history-row .history-item{flex:1;min-width:0;width:auto;margin:0;padding-right:4px}
.history-row .history-item>span{width:100%;min-width:0}
.history-row .history-item strong,.history-row .history-item small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-row .history-item[aria-current=true]{background:transparent;border-color:transparent}
.session-pin{flex-shrink:0;opacity:0;color:var(--muted)}
.history-row:hover .session-pin,.history-row:focus-within .session-pin{opacity:1}
.session-pin:hover,.session-pin:focus-visible{color:var(--fg)}
.session-pin svg{width:16px;height:16px;stroke-width:1.7}
.session-pin[aria-pressed=true]{color:var(--fg-2)}
.session-pin[aria-pressed=true]:hover,.session-pin[aria-pressed=true]:focus-visible{color:var(--fg)}
.history-group+.history-group{margin-top:20px}
@media(hover:none){.session-pin{opacity:1}}
@media(prefers-reduced-motion:reduce){.session-state.running{animation:none}}
/* Always dock the composer below the independently scrolling thread.
   Keep it in flow so it never covers the last message. */
.composer-area{flex-shrink:0;padding:8px 0 env(safe-area-inset-bottom,0px)}
.composer{padding:16px 16px 10px;border-color:color-mix(in oklch,var(--fg) 14%,transparent);background:color-mix(in oklch,var(--bg) 55%,var(--surface))}
.composer textarea{height:88px;padding:0 4px 12px}

.composer-foot{display:block;min-height:20px;padding:0 4px}
.composer-foot .status{display:block;min-height:20px;line-height:20px;overflow-wrap:anywhere}
.composer-foot>span:last-child{display:none}
.workspace:has(.empty-state) .thread-heading{display:none}
.workspace:has(.empty-state) .empty-state{padding:40px 0 24px}
.workspace:has(.empty-state) .empty-state .brand-mark{display:none}
.workspace:has(.empty-state) .empty-state h2{margin:0 0 12px}
.workspace:has(.empty-state) .quick-prompts{margin-top:20px}

 .composer-area{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Compact composer: one row at rest, expands naturally for longer drafts. */
.composer{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:end;gap:8px;padding:4px 10px;border-radius:32px;background:var(--surface)}
.composer:focus-within{border-color:color-mix(in oklch,var(--fg) 35%,transparent)}
.composer textarea{grid-column:2;grid-row:1;height:44px;min-height:44px;max-height:180px;padding:10px 0;font-size:16px;line-height:24px;overflow-y:auto;scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.composer-tools,.composer-tools>.row{display:contents}
#attach{grid-column:1;grid-row:1;border-radius:50%}
#mode{grid-column:3;grid-row:1;max-width:112px;font-size:13px;margin-right:52px}
.send{grid-column:3;grid-row:1;justify-self:end;background:var(--fg);color:var(--bg)}
.send:hover:not(:disabled){background:color-mix(in oklch,var(--fg) 97%,white);color:var(--bg)}
.send svg{stroke-width:1.8;width:24px;height:24px}
.attachment:not(:empty){grid-column:1/-1;grid-row:2;padding:4px 12px}
.run-state{align-items:flex-start;flex-wrap:wrap}.run-spinner{width:10px;height:10px;margin-top:7px;border:0;background:var(--fg-2);animation:run-pulse 1.4s ease-in-out infinite}
.run-output{flex-basis:100%;white-space:pre-wrap;line-height:1.85;color:var(--fg-2);font-size:14px}.run-output:empty{display:none}
@keyframes run-pulse{50%{opacity:.35;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.run-spinner{animation:none}}
@media(max-width:640px){.composer{gap:4px;padding:4px 8px;border-radius:28px}.composer textarea{font-size:16px}#mode{max-width:88px;padding:0 2px;font-size:12px;margin-right:48px}}
.usage{margin-top:4px;color:var(--muted);font-size:12px}
.usage-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 20px;padding:0 12px}

[data-od-id="token-usage"] svg{display:block;width:18px;height:18px;flex:0 0 18px;align-self:center;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

window.runSessionStatusChecks=()=>{
 const s={id:'status-check',messages:[]};

 expect(sessionState(s,false),'idle');expect(sessionState(s,true),'running');

 s.messages.push({role:'assistant',text:'完成'});expect(sessionState(s,false),'completed');
 s.unread=true;expect(sessionState(s,false),'unread');expect(sessionState(s,true),'running');

 s.unread=false;expect(sessionState(s,false),'completed');

 return '会话状态检查通过';
